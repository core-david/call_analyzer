# Render Blueprint — Call Analyzer
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# After the first deploy, set the sync:false secrets (see README/D3) and wire
# the two cross-references (CORS_ORIGINS <-> VITE_API_BASE_URL).
#
# Values to confirm against your Render account are marked  # CONFIRM
services:
  # ---- FastAPI web service --------------------------------------------------
  - name: call-analyzer-api
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    plan: starter            # CONFIRM (free exists but cold-starts on idle)
    region: oregon           # CONFIRM (match your DB/Redis region)
    healthCheckPath: /health
    preDeployCommand: uv run alembic upgrade head   # migrate managed Postgres
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: call-analyzer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: call-analyzer-redis
          type: keyvalue
          property: connectionString
      - key: STORAGE_REGION
        value: auto
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false          # set to the static site URL after first deploy

  # ---- arq background worker (same image, different command) ----------------
  - name: call-analyzer-worker
    type: worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uv run arq app.worker.settings.WorkerSettings
    plan: starter            # CONFIRM
    region: oregon           # CONFIRM (same region as api)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: call-analyzer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: call-analyzer-redis
          type: keyvalue
          property: connectionString
      - key: STORAGE_REGION
        value: auto
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        sync: false

  # ---- Redis / Key Value (the arq queue) ------------------------------------
  - name: call-analyzer-redis
    type: keyvalue
    plan: starter            # CONFIRM
    region: oregon           # CONFIRM (same region)
    ipAllowList: []          # internal-only (no public access)
    maxmemoryPolicy: noeviction   # queued jobs must never be evicted

  # ---- Static site (the Vite SPA) -------------------------------------------
  - name: call-analyzer-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to the API URL, then redeploy (Vite bakes at build)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback for react-router

databases:
  # ---- Managed Postgres -----------------------------------------------------
  - name: call-analyzer-db
    plan: basic-256mb        # CONFIRM (free exists but expires ~90 days)
    region: oregon           # CONFIRM (same region as services)
    postgresMajorVersion: "16"
